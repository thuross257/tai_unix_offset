[project]
name = "tai-unix-offset"
version = "0.1.0"
description = "Maintains the table of leap seconds and converts between Unix timestamps and International Atomic Time."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
